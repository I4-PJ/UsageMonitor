name: Build release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'New version tag to publish after checks pass (leave empty to build only)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package ${{ matrix.runtime }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            runner: windows-2022
          - runtime: osx-arm64
            runner: macos-15
          - runtime: osx-x64
            runner: macos-15-intel
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      TARGET_RUNTIME: ${{ matrix.runtime }}
      RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'
      - name: Read release version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG) {
            if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z][0-9A-Za-z.-]*)?)$') {
              throw 'Expected a version tag such as v0.1.0 or v0.1.0-rc.1.'
            }
            $version = $Matches[1]
          } else {
            [xml] $project = Get-Content UsageMonitor.csproj -Raw
            $version = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Run unit tests
        run: dotnet test UsageMonitor.Tests/UsageMonitor.Tests.csproj --configuration Release
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Runtime $env:TARGET_RUNTIME -Version $env:APP_VERSION
      - name: Check Windows startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executable = Join-Path $PWD 'artifacts/publish/win-x64/UsageMonitor.exe'
          $app = Start-Process -FilePath $executable -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 10
            if ($app.HasExited) { throw "Usage Monitor exited during startup with code $($app.ExitCode)." }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id }
          }
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: VERSION="$APP_VERSION" bash scripts/package-macos.sh "$TARGET_RUNTIME"
      - name: Check macOS bundle and startup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="$PWD/artifacts/macos/UsageMonitor.app"
          plutil -lint "$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/UsageMonitor"
          test -x "$app/Contents/MacOS/UsageMonitor.real"
          test -f "$app/Contents/MacOS/LICENSE"
          test -f "$app/Contents/MacOS/ThirdPartyLicenses/README.md"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          test "$version" = "${APP_VERSION%%-*}"
          if [[ "$TARGET_RUNTIME" == osx-arm64 ]]; then architecture=arm64; else architecture=x86_64; fi
          test "$(lipo -archs "$app/Contents/MacOS/UsageMonitor.real")" = "$architecture"
          trap 'pkill -x UsageMonitor.real || true' EXIT
          open "$app"
          sleep 10
          pgrep -x UsageMonitor.real
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.runtime }}
          path: artifacts/UsageMonitor-*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Generate and verify checksums
        shell: bash
        run: |
          cd dist
          test -f "UsageMonitor-${RELEASE_TAG#v}-win-x64.zip"
          test -f "UsageMonitor-${RELEASE_TAG#v}-osx-arm64.zip"
          test -f "UsageMonitor-${RELEASE_TAG#v}-osx-x64.zip"
          sha256sum UsageMonitor-*.zip > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Usage Monitor $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          flags=()
          if [[ "$RELEASE_TAG" == v0.* || "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" dist/UsageMonitor-*.zip dist/SHA256SUMS.txt \
            --verify-tag --draft --title "Usage Monitor $RELEASE_TAG" \
            --notes-file Packaging/RELEASE_NOTES.md --generate-notes "${flags[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
